<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" role="img" aria-label="WikiResearch — Research Anything, Understand Everything">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8c06a"/>
      <stop offset="1" stop-color="#b8892d"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16161e"/>
      <stop offset="1" stop-color="#0d0d0f"/>
    </linearGradient>
  </defs>

  <rect width="600" height="160" rx="18" fill="url(#bg)" stroke="rgba(212,168,75,0.25)" stroke-width="1.5"/>

  <!-- Mark: serif W inside a magnifying-glass lens -->
  <g>
    <circle cx="78" cy="72" r="28" fill="none" stroke="url(#gold)" stroke-width="4.5"/>
    <line x1="98" y1="92" x2="114" y2="108" stroke="url(#gold)" stroke-width="6.5" stroke-linecap="round"/>
    <circle cx="78" cy="72" r="34" fill="none" stroke="rgba(110,181,255,0.25)" stroke-width="1.5" stroke-dasharray="3 6"/>
    <text x="78" y="84" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="34" fill="#e0b45c">W</text>
  </g>

  <!-- Wordmark -->
  <text x="140" y="86" font-family="Georgia, 'Times New Roman', serif" font-size="44">
    <tspan fill="#f0eee8">Wiki</tspan><tspan fill="#d4a84b" font-style="italic">Research</tspan>
  </text>
  <text x="142" y="118" font-family="'Courier New', monospace" font-size="13" letter-spacing="4" fill="#8a8890">RESEARCH ANYTHING · UNDERSTAND EVERYTHING</text>
</svg>
